name: AdventureCoder
options:
  bundleIdPrefix: com.adventurecoder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
packages:
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    from: 0.3.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  AdventureCoder:
    type: application
    platform: iOS
    sources:
      - path: AdventureCoder
        excludes:
          - "**/.DS_Store"
    resources:
      - path: AdventureCoder/Resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: NIOSSH
    info:
      path: AdventureCoder/Resources/Info.plist
      properties:
        CFBundleDisplayName: Adventure Coder
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationCategoryType: public.app-category.developer-tools
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "Adventure Coder can scan pasted code or capture screenshots for the AI assistant."
        NSPhotoLibraryUsageDescription: "Adventure Coder attaches screenshots to AI conversations when you choose them."
        NSAppleEventsUsageDescription: "Adventure Coder can invoke other developer apps you have authorized."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adventurecoder.app
        INFOPLIST_FILE: AdventureCoder/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AdventureCoder/Resources/AdventureCoder.entitlements
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AdventureCoderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdventureCoderTests
    dependencies:
      - target: AdventureCoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adventurecoder.app.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AdventureCoder.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AdventureCoder"
